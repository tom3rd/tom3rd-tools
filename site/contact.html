<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>문의 — tom3rd.com</title>
<meta name="description" content="초대 관련 문의나 리포트 의견을 남기는 페이지.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header class="site-head">
  <a class="brand" href="index.html">tom3rd<span>.</span>com</a>
  <nav aria-label="주 메뉴"><ul class="nav">
    <li><a href="index.html">홈</a></li>
    <li><a href="services.html">서비스</a></li>
    <li><a href="about.html">소개</a></li>
    <li><a href="contact.html" aria-current="page">문의</a></li>
  </ul></nav>
</header>
<main>

<section class="intro">
  <span class="label">Contact</span>
  <h1>문의</h1>
  <p>초대 요청, 리포트에 대한 의견, 오류 제보를 보내 주세요. 확인 후 직접 답장드립니다.</p>
</section>
<form id="contact-form" novalidate>
  <div class="field"><label for="f-name">이름</label><input id="f-name" name="name" autocomplete="name" required></div>
  <div class="field"><label for="f-mail">회신받을 이메일</label><input id="f-mail" name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label for="f-type">문의 종류</label>
    <select id="f-type" name="type"><option>초대 요청</option><option>리포트 의견</option><option>오류 제보</option><option>기타</option></select></div>
  <div class="field"><label for="f-msg">내용</label><textarea id="f-msg" name="message" required></textarea></div>
  <button class="btn" type="submit">보내기</button>
  <p class="status" id="status" role="status"></p>
</form>
</main>
<footer><span>© 2026 tom3rd.com · 초대받은 분을 위한 개인 아카이브</span><span>리포트는 정기적으로 갱신됩니다</span></footer>
</div>
<script src="site.js"></script>
</body>
</html>
